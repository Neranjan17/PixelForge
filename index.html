<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Block Blueprint Editor</title><link rel="stylesheet" href="style.css"></head>
<body>
<header>
<button id="new">New</button><button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button>
<span class="sp"></span>
<button id="zo" aria-label="Zoom out">−</button><button id="zi" aria-label="Zoom in">+</button><button id="fit">Fit</button>
<button id="exp" aria-haspopup="true">Export ▾</button>
<div id="expm" hidden><button id="png">PNG</button><button id="svg">SVG</button></div>
</header>
<main>
<div id="ws"><canvas id="cv"></canvas><div id="msg" role="status" hidden></div>
<div id="adj" hidden><b>Adjust image</b><button id="bzo" aria-label="Shrink image">−</button><button id="bzi" aria-label="Enlarge image">+</button><button id="bfit">Fit</button>
<input type="range" id="bo" min="0" max="100" aria-label="Opacity"><span id="bov"></span><button id="bdone" class="on">Done</button><button id="bcancel">Cancel</button></div></div>
<aside id="side">
<section id="pal" data-m="c">
<div class="row" role="tablist"><button id="mc" role="tab" class="on">Colour</button><button id="mt" role="tab">Texture</button></div>
<div id="pc"><button id="cbar" aria-label="Selected colour, tap to change"></button></div>
<div id="ptx"><div class="row"><button id="up">Upload Textures</button><button id="rm" disabled>Remove</button></div><div id="tx"></div></div>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
<div class="lbl">Reference image (tracing guide, not exported)</div>
<div class="row"><button id="bga" disabled>Add Reference Image</button></div>
<div class="row"><button id="bgj" disabled>Adjust</button><button id="bgr" disabled>Remove</button></div>
<input type="file" id="bgf" accept="image/png,image/jpeg,image/webp" hidden>
</section>
<nav id="tools">
<button class="tb" data-t="select"><i>▭</i>Select</button>
<button class="tb" data-t="fill"><i>▦</i>Fill</button>
<button class="tb" data-t="erase"><i>⌫</i>Erase</button>
<button class="tb" data-t="move"><i>✥</i>Move</button>
<button class="tb" data-t="pick"><i>◉</i>Pick</button>
<button class="tb" id="copy" disabled><i>⧉</i>Copy</button>
<button class="tb" id="paste" data-t="paste" disabled><i>⎘</i>Paste</button>
<button class="tb" id="pt"><i id="sw"></i>Palette</button>
</nav>
</aside>
</main>
<footer id="st"></footer>
<dialog id="dlg"><form id="f" method="dialog" novalidate><h2>Create canvas</h2>
<label>Width (blocks)<input id="w" type="number" min="1" max="512" value="32" required></label>
<label>Height (blocks)<input id="h" type="number" min="1" max="512" value="32" required></label>
<details id="adv"><summary>Advanced settings</summary>
<label>Pixels per block<input id="r" type="number" min="1" max="256" step="1" value="16"></label></details>
<p id="px"></p><p id="err" role="alert"></p>
<div class="row"><button type="button" id="cancel">Cancel</button><button class="on">Create</button></div>
<div class="row"><button type="button" id="imp">Import SVG project…</button></div>
<input type="file" id="impf" accept=".svg,image/svg+xml" hidden>
</form></dialog>
<dialog id="cpd"><h2>Colour</h2><div id="sug" class="cg"></div>
<div id="allw" hidden><div class="lbl">All project colours</div><div id="allc" class="cg"></div></div>
<div class="row"><button type="button" id="cust">Custom</button></div></dialog>
<dialog id="hsvd"><h2>Custom colour</h2>
<label>Hue <output id="oh"></output><input id="sh" type="range" min="0" max="360"></label>
<label>Saturation <output id="os"></output><input id="ss" type="range" min="0" max="100"></label>
<label>Value <output id="ov"></output><input id="sv" type="range" min="0" max="100"></label>
<label>Native picker<input type="color" id="col" value="#7cbd4b"></label>
<div class="row"><button type="button" id="hback">Back</button><button type="button" id="happ" class="on">Apply</button></div></dialog>
<script src="script.js"></script>
</body></html>
